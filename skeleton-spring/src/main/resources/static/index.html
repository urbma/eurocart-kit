<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EuroCart</title>
  <link rel="stylesheet" href="/te.css">
  <style>
    /* Categories on the left, products in the centre, the cart on the right and in view while scrolling. */
    main { display: grid; grid-template-columns: 11rem minmax(0, 1fr) 21rem; gap: 1rem; align-items: start; }
    main > nav, main > section { padding: 1rem; border: 1px solid var(--ink); background: var(--panel); }
    #cart { position: sticky; top: 1rem; }
    /* Without the category list (it is hidden on the landing page) the products take its column. */
    @media (min-width: 961px) { main:has(#categories[hidden]) { grid-template-columns: minmax(0, 1fr) 21rem; } }
    @media (max-width: 960px) {
      main { grid-template-columns: minmax(0, 1fr); }
      #cart { position: static; }
      #categories ul { display: flex; flex-wrap: wrap; gap: .4rem; }
      #categories button { width: auto; border: 1px solid var(--ink); }
    }
    /* The categories are numbered like the channels of a device. */
    #categories ul { margin: .5rem 0 0; padding: 0; list-style: none; counter-reset: category; }
    #categories li { counter-increment: category; }
    #categories button { display: flex; gap: .6rem; width: 100%; padding: .45rem .3rem; border: 0; border-bottom: 1px solid var(--line);
      background: none; text-align: left; }
    #categories button::before { content: counter(category, decimal-leading-zero); color: var(--grey); }
    #categories button:hover { background: var(--ink); color: #fff; }
    #categories button:hover::before { color: var(--orange); }
    #categories button[aria-pressed="true"] { background: var(--orange); color: var(--ink); }
    #categories button[aria-pressed="true"]::before { color: var(--ink); }
    details.vat summary { cursor: pointer; font: 600 .66rem var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--grey); }
    details.vat summary:hover { color: var(--ink); }
    details.vat table { margin-top: .4rem; font: .75rem var(--mono); color: var(--grey); }
    details.vat th { padding: .15rem 0 .15rem .75rem; text-align: right; }
    details.vat th:first-child { padding-left: 0; text-align: left; }
    details.vat td { padding: .15rem 0; border-bottom: 0; }
    details.vat td + td { padding-left: .75rem; }
    details.vat tr.sum td { border-top: 1px solid var(--line); font-weight: 700; color: var(--ink); }
    .row { display: grid; grid-template-columns: 2fr 1fr; gap: .5rem; }
    label.terms { display: flex; align-items: flex-start; gap: .6rem; margin-top: 1rem; font: .85rem var(--sans);
      text-transform: none; letter-spacing: 0; color: var(--ink); }
    label.terms input { flex: none; width: auto; margin: .15rem 0 0; }
    #payment-status { padding-left: .6rem; border-left: 3px solid var(--orange); }
    #payment-status:empty { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>EuroCart<span>.</span></h1>
    <span id="flag" class="flag" role="img"></span>
  </header>
  <main>
    <nav id="categories" aria-label="Categories" hidden>
      <h2>Categories</h2>
      <ul></ul>
    </nav>
    <section>
      <h2 id="products-title">Products</h2>
      <!-- Legal: consumers see prices incl. VAT and the shipping costs; food names state the unit price basis. -->
      <p class="muted" id="price-note"></p>
      <div id="products"></div>
    </section>
    <section id="cart">
      <h2>Cart</h2>
      <p id="error"></p>
      <p class="muted" id="cart-empty">Your cart is empty.</p>
      <div id="cart-filled" hidden>
        <table><tbody id="cart-lines"></tbody></table>
        <!-- Legal: delivery costs and the total incl. VAT are shown before the customer orders. -->
        <table class="summary">
          <tr id="shipping-row"><td>Shipping</td><td class="num" id="shipping"></td></tr>
          <tr class="total"><td>Total</td><td class="num" id="total"></td></tr>
          <tr><td colspan="2">
            <details class="vat">
              <summary id="vat-note"></summary>
              <table>
                <thead><tr><th>VAT rate</th><th>Excl. VAT</th><th>VAT</th></tr></thead>
                <tbody id="vat-breakdown"></tbody>
              </table>
            </details>
          </td></tr>
        </table>
        <button id="checkout" class="primary">Checkout</button>
      </div>

      <form id="order-form" hidden>
        <fieldset>
          <legend>Contact</legend>
          <label>Email <input name="email" type="email" autocomplete="email" required></label>
        </fieldset>
        <fieldset id="shipping-fields">
          <legend>Shipping address</legend>
          <label>Full name <input name="fullName" autocomplete="name"></label>
          <div class="row">
            <label>Street <input name="street" autocomplete="address-line1"></label>
            <label>House number <input name="houseNumber"></label>
          </div>
          <div class="row">
            <label>Postal code <input name="postalCode" placeholder="00-950" autocomplete="postal-code"></label>
            <label>City <input name="city" autocomplete="address-level2"></label>
          </div>
          <label>Country
            <select name="country"><option value="PL" selected>Poland</option></select>
          </label>
          <label>Phone (optional) <input name="phone" type="tel" autocomplete="tel"></label>
        </fieldset>
        <p class="muted" id="digital-note" hidden>Only digital products in your cart: no shipping address needed.</p>
        <label class="terms">
          <input type="checkbox" name="terms" required>
          <span>I have read and accept the <a href="/terms.html" target="_blank" rel="noopener">terms and conditions</a>.</span>
        </label>
        <!-- Legal: the button that places the order must say that it comes with an obligation to pay. -->
        <button type="submit" class="primary" id="place-order" disabled>Order and pay with PayPal</button>
      </form>
      <p id="payment-status"></p>
    </section>
  </main>

  <script>
    // All amounts come from the backend PricingService, already converted to the currency of the storefront and
    // including the VAT of its country. The backend lists the storefronts; this only adds how to show them.
    const STOREFRONT_LABELS = {
      NL: { name: 'Nederland', locale: 'nl-NL', vat: 'Dutch VAT' },
      DE: { name: 'Deutschland', locale: 'de-DE', vat: 'German VAT' },
      FR: { name: 'France', locale: 'fr-FR', vat: 'French VAT' },
      PL: { name: 'Polska', locale: 'pl-PL', vat: 'Polish VAT' },
      CH: { name: 'Schweiz', locale: 'de-CH', vat: 'Swiss VAT' },
      GB: { name: 'United Kingdom', locale: 'en-GB', vat: 'UK VAT' }
    };
    const DEFAULT_COUNTRY = 'PL';
    const flagEl = document.getElementById('flag');
    // Flags as inline SVG: Windows shows flag emoji as the two letters of the country code.
    const FLAGS = {
      NL: '<svg viewBox="0 0 9 6"><path fill="#AE1C28" d="M0 0h9v2H0z"/><path fill="#fff" d="M0 2h9v2H0z"/><path fill="#21468B" d="M0 4h9v2H0z"/></svg>',
      DE: '<svg viewBox="0 0 5 3"><path d="M0 0h5v1H0z"/><path fill="#D00" d="M0 1h5v1H0z"/><path fill="#FFCE00" d="M0 2h5v1H0z"/></svg>',
      FR: '<svg viewBox="0 0 3 2"><path fill="#002654" d="M0 0h1v2H0z"/><path fill="#fff" d="M1 0h1v2H1z"/><path fill="#CE1126" d="M2 0h1v2H2z"/></svg>',
      PL: '<svg viewBox="0 0 8 5"><path fill="#fff" d="M0 0h8v2.5H0z"/><path fill="#DC143C" d="M0 2.5h8V5H0z"/></svg>',
      CH: '<svg viewBox="0 0 32 32"><path fill="#DA291C" d="M0 0h32v32H0z"/><path fill="#fff" d="M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z"/></svg>',
      GB: '<svg viewBox="0 0 60 30"><clipPath id="gb-s"><path d="M0 0v30h60V0z"/></clipPath>'
        + '<clipPath id="gb-t"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath><g clip-path="url(#gb-s)">'
        + '<path fill="#012169" d="M0 0v30h60V0z"/><path stroke="#fff" stroke-width="6" d="M0 0l60 30m0-30L0 30"/>'
        + '<path stroke="#C8102E" stroke-width="4" clip-path="url(#gb-t)" d="M0 0l60 30m0-30L0 30"/>'
        + '<path stroke="#fff" stroke-width="10" d="M30 0v30M0 15h60"/><path stroke="#C8102E" stroke-width="6" d="M30 0v30M0 15h60"/></g></svg>'
    };

    // The storefront follows the visitor's IP address. ?country=DE forces one instead (handy locally, where there is
    // no public IP to locate); it is remembered for the rest of the session, also after the PayPal page.
    const COUNTRY_KEY = 'eurocart.country';
    const forcedCountry = (() => {
      const asked = (new URLSearchParams(location.search).get('country') || '').toUpperCase();
      const valid = Object.hasOwn(STOREFRONT_LABELS, asked);
      try {
        if (valid) sessionStorage.setItem(COUNTRY_KEY, asked);
        return sessionStorage.getItem(COUNTRY_KEY);
      } catch {
        return valid ? asked : null;
      }
    })();
    let storefront = { country: DEFAULT_COUNTRY, currency: 'PLN' };
    let moneyFormat;
    const formatMoney = amount => moneyFormat.format(amount);
    const errorEl = document.getElementById('error');

    function useStorefront(next) {
      storefront = next;
      const label = STOREFRONT_LABELS[next.country];
      moneyFormat = new Intl.NumberFormat(label.locale, { style: 'currency', currency: next.currency });
    }

    function renderPriceNote(shipping) {
      document.getElementById('price-note').textContent =
          `Prices in ${storefront.currency} incl. ${STOREFRONT_LABELS[storefront.country].vat}. ` +
          `Orders with physical products: plus ${formatMoney(shipping.gross)} shipping (incl. VAT).`;
    }

    async function api(path, options) {
      errorEl.textContent = '';
      const response = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
      const body = await response.json().catch(() => null);
      if (!response.ok) {
        errorEl.textContent = (body && body.detail) || `${response.status} ${response.statusText}`;
        throw new Error(errorEl.textContent);
      }
      return body;
    }

    const CATEGORY_LABELS = { LAPTOP: 'Laptops', BOOK: 'Books', EBOOK: 'E-books', FOOD: 'Food', MEDICINE: 'Medicine' };
    const categoryLabel = category => CATEGORY_LABELS[category] || category;
    let selectedCategory = null; // null: all categories

    function renderCategories(products) {
      const list = document.querySelector('#categories ul');
      list.innerHTML = '';
      for (const category of [null, ...new Set(products.map(p => p.category))]) {
        const button = document.createElement('button');
        button.textContent = category ? categoryLabel(category) : 'All products';
        button.setAttribute('aria-pressed', category === selectedCategory);
        button.onclick = () => {
          selectedCategory = category;
          renderCategories(products);
          renderProducts(products, prices);
        };
        list.appendChild(document.createElement('li')).appendChild(button);
      }
    }

    let prices = {};

    function renderProducts(products, productPrices) {
      prices = productPrices;
      const shown = products.filter(p => !selectedCategory || p.category === selectedCategory);
      document.getElementById('products-title').textContent = selectedCategory ? categoryLabel(selectedCategory) : 'Products';
      const byCategory = Map.groupBy(shown, p => p.category);
      const container = document.getElementById('products');
      container.innerHTML = '';
      for (const [category, items] of byCategory) {
        if (!selectedCategory) {
          const heading = document.createElement('h3');
          heading.textContent = categoryLabel(category);
          container.appendChild(heading);
        }
        const table = document.createElement('table');
        for (const p of items) {
          const row = table.insertRow();
          row.insertCell().textContent = p.name;
          const price = row.insertCell(); price.className = 'num';
          price.textContent = formatMoney(prices[p.id].gross);
          const action = row.insertCell(); action.className = 'action';
          const button = document.createElement('button');
          button.textContent = 'Add';
          button.setAttribute('aria-label', `Add ${p.name}`);
          button.onclick = () => addToCart(p.id);
          action.appendChild(button);
        }
        container.appendChild(table);
      }
    }

    function renderCart(cart) {
      const tbody = document.getElementById('cart-lines');
      tbody.innerHTML = '';
      for (const line of cart.lines) {
        const row = tbody.insertRow();
        row.insertCell().textContent = line.quantity > 1 ? `${line.quantity} × ${line.product.name}` : line.product.name;
        const amount = row.insertCell(); amount.className = 'num'; amount.textContent = formatMoney(line.price.gross);
        const action = row.insertCell(); action.className = 'action';
        const button = document.createElement('button');
        button.textContent = '×';
        button.setAttribute('aria-label', `Remove ${line.product.name}`);
        button.onclick = () => removeFromCart(line.product.id);
        action.appendChild(button);
      }
      document.getElementById('cart-empty').hidden = cart.lines.length > 0;
      document.getElementById('cart-filled').hidden = cart.lines.length === 0;
      // Shown to the consumer incl. VAT; the excl. VAT amounts stay in the order's pricing snapshot.
      document.getElementById('shipping-row').hidden = !cart.shipping;
      if (cart.shipping) document.getElementById('shipping').textContent = formatMoney(cart.shipping.gross);
      document.getElementById('total').textContent = formatMoney(cart.gross);
      document.getElementById('vat-note').textContent =
          `Incl. ${formatMoney(cart.vat)} ${STOREFRONT_LABELS[storefront.country].vat}`;
      renderVatBreakdown(cart);
    }

    // The VAT of the cart per rate, shipping included. The lines are already rounded, so the sums match the totals.
    function renderVatBreakdown(cart) {
      const prices = [...cart.lines.map(line => line.price), ...(cart.shipping ? [cart.shipping] : [])];
      const byRate = Map.groupBy(prices, price => Number(price.vatPercent));
      const tbody = document.getElementById('vat-breakdown');
      tbody.innerHTML = '';
      const addRow = (label, net, vat, className) => {
        const row = tbody.insertRow();
        if (className) row.className = className;
        row.insertCell().textContent = label;
        for (const amount of [net, vat]) {
          const cell = row.insertCell(); cell.className = 'num'; cell.textContent = formatMoney(amount);
        }
      };
      for (const [rate, ratePrices] of [...byRate].sort(([a], [b]) => b - a)) {
        const sum = field => ratePrices.reduce((total, price) => total + price[field], 0);
        addRow(`${rate}%`, sum('net'), sum('vat'));
      }
      addRow('Total', cart.net, cart.vat, 'sum');
    }

    // The cart endpoints change the cart; the priced cart is always read from the pricing endpoint of the storefront.
    const pricingPath = path => `/api/pricing/${path}?country=${storefront.country}`;
    const refreshCart = async () => renderCart(await api(pricingPath('cart')));

    async function addToCart(productId) {
      await api('/api/cart/items', { method: 'POST', body: JSON.stringify({ productId, quantity: 1 }) });
      await refreshCart();
    }

    async function removeFromCart(productId) {
      await api(`/api/cart/items/${productId}`, { method: 'DELETE' });
      await refreshCart();
    }

    const statusEl = document.getElementById('payment-status');
    const orderForm = document.getElementById('order-form');
    const placeOrderButton = document.getElementById('place-order');

    // Paying is only possible once the terms and conditions are accepted (the server checks this too).
    const syncPlaceOrderButton = () => { placeOrderButton.disabled = !orderForm.elements.terms.checked; };
    orderForm.elements.terms.onchange = syncPlaceOrderButton;

    // Step 1: show the contact / shipping form. Shipping is only needed when the cart has physical products.
    document.getElementById('checkout').onclick = async () => {
      statusEl.textContent = '';
      const cart = await api(pricingPath('cart'));
      if (cart.lines.length === 0) {
        errorEl.textContent = 'Your cart is empty.';
        return;
      }
      const physical = cart.lines.some(line => line.product.category !== 'EBOOK');
      document.getElementById('shipping-fields').hidden = !physical;
      document.getElementById('digital-note').hidden = physical;
      orderForm.dataset.physical = physical;
      orderForm.hidden = false;
      syncPlaceOrderButton();
      orderForm.elements.email.focus();
    };

    // Step 2: save the order (status PENDING, price snapshot) and go to the simulated PayPal page for that order.
    orderForm.onsubmit = async event => {
      event.preventDefault();
      const field = name => orderForm.elements[name].value;
      const shipping = orderForm.dataset.physical === 'true'
        ? Object.fromEntries(['fullName', 'street', 'houseNumber', 'postalCode', 'city', 'country', 'phone']
            .map(name => [name, field(name)]))
        : null;
      const order = await api('/api/orders', { method: 'POST',
          body: JSON.stringify({ email: field('email'), shipping, storefront: storefront.country,
            termsAccepted: orderForm.elements.terms.checked }) });
      location.href = `/paypal-simulator.html?order=${encodeURIComponent(order.id)}`;
    };

    // Back from the simulated PayPal page after cancelling; a paid order goes to order.html instead.
    const returned = new URLSearchParams(location.search);
    if (returned.has('cancelled')) {
      statusEl.textContent = `Payment cancelled. Order ${returned.get('cancelled')} is saved but not paid; your cart is unchanged.`;
    }
    if (returned.size) history.replaceState(null, '', location.pathname);

    let products = [];
    let storefronts = [];

    // Landing page: only the most expensive e-book is shown. The rest stays in the catalogue and the API; if there
    // were no e-books at all, the whole catalogue is shown so the shop is never empty. The category list is hidden.
    function landingProducts(all) {
      const ebooks = all.filter(p => p.category === 'EBOOK');
      return ebooks.length ? [ebooks.reduce((best, p) => p.price > best.price ? p : best)] : all;
    }

    async function showStorefront(country) {
      useStorefront(storefronts.find(s => s.country === country) || storefronts.find(s => s.country === DEFAULT_COUNTRY));
      const label = STOREFRONT_LABELS[storefront.country];
      flagEl.innerHTML = FLAGS[storefront.country];
      flagEl.title = flagEl.ariaLabel = `${label.name} (${storefront.currency})`;
      const [prices, shipping] = await Promise.all([api(pricingPath('products')), api(pricingPath('shipping'))]);
      renderPriceNote(shipping);
      renderProducts(products, prices);
      await refreshCart();
    }

    Promise.all([api('/api/products'), api('/api/pricing/storefronts')])
      .then(async ([allProducts, allStorefronts]) => {
        products = landingProducts(allProducts);
        storefronts = allStorefronts;
        const country = forcedCountry || (await api('/api/geo/country')).country;
        return showStorefront(country);
      });
  </script>
</body>
</html>
