spring.application.name=eurocart
server.port=8081

# Where a notification for the sales person is sent for every paid order (a Power Automate flow). Empty: none are sent.
# It contains a secret, so set it in config/application.properties (not in git) or in this environment variable.
eurocart.sales-notification.url=${EUROCART_SALES_NOTIFICATION_URL:}

# The daily sales report (a second Power Automate flow): sent every night for the day that just ended. Empty URL: not sent.
# Like the one above it contains a secret: config/application.properties (not in git) or this environment variable.
eurocart.daily-report.url=${EUROCART_DAILY_REPORT_URL:}
# Spring cron (seconds first), in the time zone of the shop. The default is 00:05 every night.
eurocart.daily-report.cron=0 5 0 * * *
